<div class="d-flex justify-content-between align-items-center mb-3">
  <p class="mb-0">{{ message }}</p>
  <button *ngIf="isLoggedIn()" (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>
<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let trip of trips">
    <app-trip-card [trip]="trip" (tripDeleted)="onTripDeleted()"></app-trip-card>
  </div>
</div>
