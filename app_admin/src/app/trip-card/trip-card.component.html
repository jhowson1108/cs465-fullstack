<div class="card h-100">
  <div class="card-header">{{ trip.name }}</div>
  <img src="assets/images/{{ trip.image }}" class="card-img-top" alt="{{ trip.name }}">
  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.length }} starting {{ trip.start | date:'mediumDate':'UTC' }} - {{ trip.perPerson | currency:'USD':'symbol' }}</h6>
    <div class="card-text" [innerHTML]="trip.description"></div>
  </div>
  <div class="card-footer">
    <button (click)="editTrip(trip)" class="btn btn-info me-2">Edit Trip</button>
    <button (click)="deleteTrip(trip)" class="btn btn-danger">Delete Trip</button>
  </div>
</div>
