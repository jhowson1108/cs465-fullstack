<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-3">Sign Up</h1>
    <div class="alert alert-danger" role="alert" *ngIf="formError">{{ formError }}</div>
    <form (ngSubmit)="onRegisterSubmit()">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name"
          placeholder="Full name" [(ngModel)]="credentials.name">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
          placeholder="Enter email address" [(ngModel)]="credentials.email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password"
          placeholder="At least 8 characters" [(ngModel)]="credentials.password">
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Re-type Password</label>
        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
          placeholder="Re-type password" [(ngModel)]="credentials.confirmPassword">
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="agree" name="agree"
          [(ngModel)]="credentials.agree">
        <label class="form-check-label" for="agree">
          I agree to the Terms of Use and Privacy Policy
        </label>
      </div>
      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
    <p class="mt-3">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
